[pytest]
# Pytest configuration for UnserTurnierplan tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on unknown config options
    --strict-config
    # Capture output (use -s to disable)
    --capture=no
    # Show durations of slowest tests
    --durations=10
    # Color output
    --color=yes
    # Display warnings
    -W default

# Markers for categorizing tests
markers =
    sprint2: Sprint 2 - Club Management tests
    sprint3: Sprint 3 - Tournament Management tests
    sprint4: Sprint 4 - Match Scheduling & Brackets tests
    crud: Tests for CRUD operations
    permissions: Tests for permission system
    integration: Integration tests that require backend
    slow: Tests that take significant time to run
    bracket: Tests for bracket generation
    scoring: Tests for match scoring
    standings: Tests for tournament standings

# Console output settings
console_output_style = progress

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Test execution options
# Run tests in parallel if pytest-xdist is installed
# Use: pytest -n auto
